# The one deploy config. Run `npx wrangler deploy` from this folder (or any subfolder).
name = "ml-host"
main = "cloud/src/worker.js"
compatibility_date = "2026-10-01"

# The Worker serves the static pages and only runs for paths with no matching file (/api/*).
[assets]
directory = "site"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "locallink-try"
database_id = "07c0b6d1-4736-4930-92e7-0f231acc20be"

# Per-IP limit on cloud calls.
[[ratelimits]]
name = "PER_IP"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[observability]
enabled = true

[vars]
# Hard cap on cloud calls per UTC day, across all three pages.
DAILY_CAP = "300"
